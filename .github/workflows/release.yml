name: Release
'on':
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  stem:
    runs-on: ubuntu-latest
    outputs:
      stem: "${{ steps.stem.outputs.stem }}"
    steps:
    - uses: actions/checkout@v7
    - id: stem
      run: >-
        printf 'stem=wolges-%s-%s\n'
        "$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%SZ)"
        "$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"
  build:
    needs: stem
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          cpu: x86-64-v2
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          cpu: generic
        - os: macos-latest
          target: aarch64-apple-darwin
          cpu: apple-m1
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          cpu: x86-64-v2
          crt: -C target-feature=+crt-static
        - os: windows-11-arm
          target: aarch64-pc-windows-msvc
          cpu: generic
          crt: -C target-feature=+crt-static
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-09
      with:
        toolchain: stable
    - name: Stable Rust version
      run: cargo version
    - name: The toolchain builds for this row's target
      shell: bash
      run: |
        host=$(rustc -vV | sed -n 's/^host: //p')
        echo "$host"
        [ "$host" = "${{ matrix.target }}" ]
    - name: Build
      shell: bash
      run: |
        reg="${CARGO_HOME:-$HOME/.cargo}/registry/src"
        std="$(rustc --print sysroot)/lib/rustlib/src/rust"
        if [ "$RUNNER_OS" = Windows ]; then reg=$(cygpath -w "$reg"); std=$(cygpath -w "$std"); fi
        hash=$(rustc -vV | sed -n 's/^commit-hash: //p')
        export RUSTFLAGS="-C target-cpu=${{ matrix.cpu }} ${{ matrix.crt }} --remap-path-prefix=$reg=/cargo --remap-path-prefix=$std=/rustc/$hash --remap-path-prefix=$GITHUB_WORKSPACE=/wolges"
        cargo build --release --verbose --bin buildlex --bin read --bin leave
    - name: No path of this machine in what ships
      shell: bash
      run: |
        exe=
        home=$HOME
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; home=$(cygpath -w "$HOME"); fi
        bad=0
        for b in buildlex read leave; do
          n=$(grep -a -c -F -e "$home" -e "$GITHUB_WORKSPACE" "target/release/$b$exe" || true)
          echo "$b: $n"
          [ "$n" = 0 ] || bad=1
        done
        exit "$bad"
    - name: No C runtime DLL that Windows may lack
      if: runner.os == 'Windows'
      shell: bash
      run: |
        rustup component add llvm-tools
        sysroot=$(cygpath -u "$(rustc --print sysroot)")
        host=$(rustc -vV | sed -n 's/^host: //p')
        bad=0
        for b in buildlex read leave; do
          dlls=$("$sysroot/lib/rustlib/$host/bin/llvm-objdump.exe" -p "target/release/$b.exe" | grep 'DLL Name:')
          printf '%s:\n%s\n' "$b" "$dlls"
          n=$(grep -c -i -e vcruntime -e msvcp <<<"$dlls" || true)
          [ "$n" = 0 ] || bad=1
        done
        exit "$bad"
    - name: Smoke run, in an empty directory
      shell: bash
      timeout-minutes: 5
      run: |
        exe=
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        bin="$PWD/target/release"
        mkdir smoke
        out="$PWD/smoke/${{ matrix.target }}.sha256"
        cd "$(mktemp -d)"
        printf 'QI\nQUA\nZA\nZAS\n' >words.txt
        "$bin/buildlex$exe" kwg words.txt words.kwg
        "$bin/read$exe" kwg words.kwg words.out
        tr -d '\r' <words.out | cmp words.txt -
        "$bin/leave$exe" --threads 1 compare words.kwg - - 1 1 --quiet | grep '^2 games'
        "$bin/leave$exe" compare words.kwg - - 1 1 --quiet | grep '^2 games'
        stem='${{ needs.stem.outputs.stem }}'
        for b in buildlex read leave; do
          "$bin/$b$exe" --version | tr -d '\r' | grep -x -F "wolges ${stem#wolges-} ${{ matrix.target }}"
        done
        # a hundred thousand random words, the same list on every runner (an
        # integer generator whose products fit awk's numbers exactly), as a
        # gaddawg, a reordered one, and a dawg of alphagrams: four words cannot
        # reach a tie in a sort, these can
        awk 'BEGIN {
          x = 2026
          while (n < 100000) {
            x = (x * 48271) % 2147483647
            len = 2 + x % 11
            w = ""
            for (i = 0; i < len; i++) {
              x = (x * 48271) % 2147483647
              w = w substr("ABCDEFGHIJKLMNOPQRSTUVWXYZ", x % 26 + 1, 1)
            }
            if (!(w in seen)) { seen[w] = 1; n++ }
          }
          for (w in seen) print w
        }' | LC_ALL=C sort >big.txt
        [ "$(wc -l <big.txt | tr -d ' ')" = 100000 ]
        "$bin/buildlex$exe" kwg big.txt big.kwg
        "$bin/buildlex$exe" kwg big.txt big-reordered.kwg --reordered
        "$bin/buildlex$exe" kwg big.txt big.kad --words alphagrams
        "$bin/read$exe" kwg big.kwg big.out
        tr -d '\r' <big.out | cmp big.txt -
        graphs='words.kwg big.kwg big-reordered.kwg big.kad'
        { sha256sum $graphs 2>/dev/null || shasum -a 256 $graphs; } | cut -d ' ' -f 1 >"$out"
        cat "$out"
    - uses: actions/upload-artifact@v7
      with:
        name: "smoke-${{ matrix.target }}"
        path: smoke/
    - name: Pack
      shell: bash
      run: |
        exe=
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        name="${{ needs.stem.outputs.stem }}-${{ matrix.target }}"
        mkdir "$name"
        for b in buildlex read leave; do cp -npv "target/release/$b$exe" "$name/"; done
        cp -npv LICENSE.txt README.md "$name/"
        if [ "$RUNNER_OS" = Windows ]; then 7z a -mx=9 "$name.zip" "$name"; else tar -cf - "$name" | gzip -9 >"$name.tar.gz"; fi
        echo "PACKED=$name" >>"$GITHUB_ENV"
    - uses: actions/upload-artifact@v7
      with:
        name: "${{ env.PACKED }}"
        path: "${{ env.PACKED }}.*"
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: wolges-*
        merge-multiple: true
    - uses: actions/download-artifact@v8
      with:
        path: smoke
        pattern: smoke-*
        merge-multiple: true
    - name: Every build made the same word graphs
      run: |
        head smoke/*
        [ "$(ls smoke | wc -l)" = "$(ls dist | wc -l)" ]
        [ "$(sha256sum smoke/* | cut -d ' ' -f 1 | sort -u | wc -l)" = 1 ]
    - name: Make this build the latest release
      env:
        GH_TOKEN: "${{ github.token }}"
        NOTES: >-
          Built from main at ${{ github.sha }} for x86-64-v2 (x86_64 Linux and Windows), apple-m1 (Apple Silicon Macs), and generic arm64 (Linux and Windows).
          Anywhere else -- an x86-64 CPU (or an emulator) without SSE4.2, which stops these with an illegal instruction, a Linux that says a GLIBC version is not found (its glibc is older than the Ubuntu 24.04 these were built on), or an Intel Mac -- build from source: cargo build --release.
          To time one, build it for your own CPU the same way.
          These are command-line programs: run them from a terminal.
          They are not signed, so Windows SmartScreen or macOS may block the first run until you allow it.
          SHA256SUMS holds each file's SHA-256; on Windows, PowerShell's `Get-FileHash <file>` prints one to compare.
      run: |
        (cd dist && sha256sum -- *) >SHA256SUMS
        mv SHA256SUMS dist/
        cat dist/SHA256SUMS
        tag="main-$GITHUB_SHA"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "main at $GITHUB_SHA" --notes "$NOTES" --latest
        fi
